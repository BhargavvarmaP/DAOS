<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DAOS — Digital Assets Operating System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            daos: { 50:'#f0f4ff',100:'#dbe4ff',200:'#bac8ff',300:'#91a7ff',400:'#748ffc',500:'#5c7cfa',600:'#4c6ef5',700:'#4263eb',800:'#3b5bdb',900:'#364fc7',950:'#1e3a5f' },
            surface: { DEFAULT:'#0f172a', raised:'#1e293b', overlay:'#334155', border:'#475569' },
            status: { success:'#22c55e', warning:'#f59e0b', danger:'#ef4444', info:'#3b82f6', neutral:'#6b7280' },
            priority: { critical:'#ef4444', high:'#f97316', medium:'#eab308', low:'#9ca3af' },
          }
        }
      }
    }
  </script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',system-ui,-apple-system,sans-serif}
    .scrollbar-thin::-webkit-scrollbar{width:6px;height:6px}
    .scrollbar-thin::-webkit-scrollbar-track{background:transparent}
    .scrollbar-thin::-webkit-scrollbar-thumb{background:#475569;border-radius:3px}
    .focus-ring:focus-visible{outline:2px solid #5c7cfa;outline-offset:2px}
    .animate-slide-in{animation:slideIn .15s ease-out}
    @keyframes slideIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
    .animate-fade-in{animation:fadeIn .2s ease-out}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    .line-clamp-2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  </style>
</head>
<body class="bg-surface text-slate-100 min-h-screen">
  <div id="root"></div>

  <!-- React 18 from CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <!-- App entry -->
  <script type="module" src="./src/main.js"></script>
</body>
</html>
